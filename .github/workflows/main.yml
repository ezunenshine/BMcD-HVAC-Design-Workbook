name: Deploy HVAC Design Workbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir _site
          unzip -q site.zip -d _site
          test -f _site/index.html
          test -f _site/styles.css
          test -f _site/app.js
          test -f _site/burns-mcdonnell-ampersand.png
          test -f _site/burns-mcdonnell-ampersand-midnight.png
          test -f _site/burns-mcdonnell-stacked-white.png
          test -f _site/burns-mcdonnell-heritage-badge.png
          test -f _site/burns-mcdonnell-horizontal.png
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
