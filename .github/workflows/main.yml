name: Deploy HVAC Design Workbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site/static/assets
          cp index.html _site/index.html
          cp styles.css _site/static/styles.css
          cp app.js _site/static/app.js
          cp model.js _site/static/model.js
          cp workbook-data.json _site/static/workbook-data.json
          cp burns-mcdonnell-horizontal.png _site/static/assets/burns-mcdonnell-horizontal.png
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
