name: Deploy HVAC Design Workbook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir _site
          unzip -q site.zip -d _site
          touch _site/.nojekyll
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > _site/version.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
