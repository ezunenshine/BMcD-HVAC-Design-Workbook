<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07192d">
    <title>IESVE Energy Model | Independent Tables</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-lockup">
          <div class="brand-mark">EM</div>
          <div>
            <strong>Energy Model</strong>
            <span>Design workspace</span>
          </div>
          <button class="icon-button sidebar-close" id="sidebarClose" aria-label="Close navigation" title="Close navigation">
            <span class="chevron left"></span>
          </button>
        </div>

        <section class="project-card" aria-label="Active project">
          <span>Active project</span>
          <strong>185021</strong>
          <small>IESVE Energy Model</small>
        </section>

        <nav class="project-nav" aria-label="Workbook navigation">
          <p class="nav-kicker">Project</p>
          <a class="nav-link" href="#overview" data-page="overview"><span class="nav-icon">⌂</span>Overview</a>
          <a class="nav-link" href="#setup" data-page="setup"><span class="nav-icon">⚙</span>Project Setup</a>

          <div class="nav-section-heading">
            <span>Independent</span>
            <span class="nav-count" id="tableCount">16</span>
            <span class="nav-group-controls">
              <button class="icon-button nav-add" id="navAdd" aria-label="Add a row to the current table" title="Add row">+</button>
              <button class="icon-button nav-arrow" id="independentToggle" aria-expanded="true" aria-controls="independentGroups" aria-label="Collapse independent tables" title="Collapse independent tables">
                <span class="chevron down"></span>
              </button>
            </span>
          </div>
          <div id="independentGroups" class="independent-groups"></div>
        </nav>

        <div class="sidebar-footer">
          <button id="exportAll" class="footer-action"><span>⇩</span>Export project JSON</button>
          <label class="footer-action file-action"><span>⇧</span>Import project JSON<input id="importAll" type="file" accept="application/json"></label>
          <button id="resetAll" class="footer-action"><span>↻</span>Reset independent tables</button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" id="menuButton" aria-label="Open navigation" title="Open navigation">☰</button>
          <div class="project-fields">
            <label>Project name<input id="projectName" value="IESVE Energy Model"></label>
            <label>Project number<input id="projectNumber" value="185021"></label>
            <label>Submittal<input id="submittal" placeholder="Enter submittal"></label>
            <label>Submittal date<input id="submittalDate" type="date"></label>
          </div>
          <div class="save-state"><span class="save-dot"></span><span id="saveText">Saved locally</span></div>
        </header>

        <main class="main-content">
          <div class="breadcrumb"><span>Project Browser</span><span>/</span><strong>Independent</strong><span>/</span><span id="breadcrumbTable"></span></div>

          <section class="page-heading">
            <div>
              <span class="eyebrow" id="sheetName"></span>
              <h1 id="tableTitle">Independent tables</h1>
              <p id="tableDescription"></p>
            </div>
            <div class="source-note">
              <span>Workbook source</span>
              <strong id="sourceRange"></strong>
            </div>
          </section>

          <section class="table-workspace" aria-labelledby="tableTitle">
            <div class="table-toolbar">
              <label class="search-field">
                <span aria-hidden="true">⌕</span>
                <input id="tableSearch" type="search" placeholder="Search this table" autocomplete="off">
              </label>
              <span class="row-summary" id="rowSummary"></span>
              <div class="toolbar-actions">
                <button id="resetTable" class="secondary-button" title="Restore this table from the source workbook">Reset</button>
                <button id="addRow" class="primary-button"><span>+</span>Add row</button>
              </div>
            </div>
            <div class="table-scroller" id="tableScroller">
              <table id="dataTable">
                <thead></thead>
                <tbody></tbody>
              </table>
              <div class="empty-state" id="emptyState" hidden>
                <strong>No matching rows</strong>
                <span>Try a different search.</span>
              </div>
            </div>
          </section>

          <footer class="engineering-note"><span id="engineeringNotice"></span><img src="/static/assets/burns-mcdonnell-horizontal.png" alt="Burns &amp; McDonnell"></footer>
        </main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
